naftiko: 1.0.0-alpha2
info:
  label: SmartBear SwaggerHub API — Domains
  description: 'SmartBear SwaggerHub API — Domains. 4 operations. Lead operation: Get Owner Domains. Self-contained Naftiko
    capability covering one Smartbear business surface.'
  tags:
  - Smartbear
  - Domains
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SMARTBEAR_API_KEY: SMARTBEAR_API_KEY
capability:
  consumes:
  - type: http
    namespace: swaggerhub-domains
    baseUri: https://api.swaggerhub.com
    description: SmartBear SwaggerHub API — Domains business capability. Self-contained, no shared references.
    resources:
    - name: domains-owner
      path: /domains/{owner}
      operations:
      - name: getownerdomains
        method: GET
        description: Get Owner Domains
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          required: true
        - name: page
          in: query
          type: integer
        - name: limit
          in: query
          type: integer
    - name: domains-owner-domain-version
      path: /domains/{owner}/{domain}/{version}
      operations:
      - name: getdomaindefinition
        method: GET
        description: Get Domain Definition
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          required: true
        - name: domain
          in: path
          type: string
          required: true
        - name: version
          in: path
          type: string
          required: true
      - name: savedomaindefinition
        method: POST
        description: Create Or Update Domain
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          required: true
        - name: domain
          in: path
          type: string
          required: true
        - name: version
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletedomainversion
        method: DELETE
        description: Delete Domain Version
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          required: true
        - name: domain
          in: path
          type: string
          required: true
        - name: version
          in: path
          type: string
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.SMARTBEAR_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: swaggerhub-domains-rest
    port: 8080
    description: REST adapter for SmartBear SwaggerHub API — Domains. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/domains/{owner}
      name: domains-owner
      description: REST surface for domains-owner.
      operations:
      - method: GET
        name: getownerdomains
        description: Get Owner Domains
        call: swaggerhub-domains.getownerdomains
        with:
          owner: rest.owner
          page: rest.page
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/domains/{owner}/{domain}/{version}
      name: domains-owner-domain-version
      description: REST surface for domains-owner-domain-version.
      operations:
      - method: GET
        name: getdomaindefinition
        description: Get Domain Definition
        call: swaggerhub-domains.getdomaindefinition
        with:
          owner: rest.owner
          domain: rest.domain
          version: rest.version
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: savedomaindefinition
        description: Create Or Update Domain
        call: swaggerhub-domains.savedomaindefinition
        with:
          owner: rest.owner
          domain: rest.domain
          version: rest.version
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletedomainversion
        description: Delete Domain Version
        call: swaggerhub-domains.deletedomainversion
        with:
          owner: rest.owner
          domain: rest.domain
          version: rest.version
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: swaggerhub-domains-mcp
    port: 9090
    transport: http
    description: MCP adapter for SmartBear SwaggerHub API — Domains. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-owner-domains
      description: Get Owner Domains
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: swaggerhub-domains.getownerdomains
      with:
        owner: tools.owner
        page: tools.page
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: get-domain-definition
      description: Get Domain Definition
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: swaggerhub-domains.getdomaindefinition
      with:
        owner: tools.owner
        domain: tools.domain
        version: tools.version
      outputParameters:
      - type: object
        mapping: $.
    - name: create-update-domain
      description: Create Or Update Domain
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: swaggerhub-domains.savedomaindefinition
      with:
        owner: tools.owner
        domain: tools.domain
        version: tools.version
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-domain-version
      description: Delete Domain Version
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: swaggerhub-domains.deletedomainversion
      with:
        owner: tools.owner
        domain: tools.domain
        version: tools.version
      outputParameters:
      - type: object
        mapping: $.
