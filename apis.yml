aid: smartbear
name: SmartBear
description: >-
  SmartBear is a software company that provides AI-powered tools for API lifecycle management including design, testing,
  documentation, and governance. Their product portfolio includes SwaggerHub for API design and documentation, ReadyAPI
  for API testing, PactFlow for contract testing, and other tools for software quality and performance. SmartBear's
  developer API enables programmatic access to manage API definitions, automate lifecycle workflows, and integrate
  SwaggerHub with CI/CD pipelines and third-party services.
