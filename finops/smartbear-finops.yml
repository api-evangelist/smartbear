  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: SmartBear
providerId: smartbear
publisherName: SmartBear Software, Inc.
serviceCategory: API Design / Testing / Observability
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - API Design
  - API Testing
  - Observability
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps placeholder for SmartBear: portfolio of design, testing, and
  observability tools sold per-product with contact-sales pricing; meters below describe the typical
  invoice-line shape but unit prices are set per signed agreement.'
sources:
  - https://smartbear.com/
notes: |
  No unified public price list. Meters reflect the typical SmartBear invoice line items (per-product
  seat / agent / project counts) but the actual unit prices come from each customer's order form.
billingModel:
  pricingCategory: Contact Sales
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
focusColumns:
  ServiceName: SmartBear
  ServiceCategory: API Design / Testing / Observability
  ProviderName: SmartBear
  PublisherName: SmartBear Software, Inc.
  InvoiceIssuerName: SmartBear Software, Inc.
  BillingCurrency: USD
meters:
  - name: swaggerhub_seats
    description: Designer seats licensed in SwaggerHub / SwaggerHub Portal.
    unit: seat
    aggregation: max
    dimensions:
      - product
      - environment
  - name: readyapi_seats
    description: ReadyAPI floating / named licenses.
    unit: seat
    aggregation: max
    dimensions:
      - product
  - name: testcomplete_seats
    description: TestComplete user / runtime licenses.
    unit: seat
    aggregation: max
    dimensions:
      - product
  - name: bugsnag_events
    description: BugSnag billable error / session events.
    unit: event
    aggregation: sum
    dimensions:
      - project
      - environment
  - name: alertsite_monitors
    description: AlertSite synthetic monitor count.
    unit: varies
    aggregation: max
    dimensions:
      - location
principles:
  - name: Visibility
    description: Aggregate seat / event / monitor counts from each product's admin console; SmartBear
      does not provide a unified consumption export across the portfolio.
  - name: Allocation
    description: Allocate per product line and per consuming team by mapping each SwaggerHub project,
      BugSnag project, or ReadyAPI seat to its owning engineering team.
  - name: Optimization
    description: Reclaim inactive SwaggerHub / ReadyAPI seats; tune BugSnag sampling and AlertSite
      monitor cadence to keep event / monitor counts within tier caps.
  - name: Accountability
    description: API platform owner reconciles monthly per-product utilization against the annual
      order forms and approves seat additions or product expansions.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
