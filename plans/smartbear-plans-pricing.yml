specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: SmartBear
providerId: smartbear
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - API Design
  - API Documentation
  - API Testing
  - Test Automation
  - Observability
description: SmartBear publishes a portfolio of products (SwaggerHub, ReadyAPI, TestComplete, Pact,
  BugSnag, AlertSite, Reflect, Zephyr, Stoplight) but does not surface a unified public price list
  on smartbear.com. Per-product pricing pages largely funnel to "Start Free Trial" / "Contact us"
  rather than published unit prices. This artifact carries a single contact-sales placeholder.
sources:
  - https://smartbear.com/
  - https://swagger.io/tools/swaggerhub/pricing/
notes: |
  swagger.io/tools/swaggerhub/pricing renders a marketing landing page without numeric tier prices
  for unauthenticated visitors; smartbear.com/pricing returns 404. SwaggerHub historically had Free,
  Team, and Enterprise tiers, but exact prices are no longer publicly listed.
plans:
  - id: smartbear-contact-sales
    name: Contact Sales
    type: enterprise
    description: SmartBear products (SwaggerHub, ReadyAPI, TestComplete, Pact, BugSnag, AlertSite,
      Zephyr, Stoplight, Reflect) are sold via product-specific sales engagements with custom
      pricing per seat / agent / project.
    entries:
      - label: Custom Negotiated Pricing
        name: custom_pricing
        type: flat
        metric: varies
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: 'contact sales'
        userMultiplied: false
    elements:
      - name: SwaggerHub (API Design + Standardization)
      - name: SwaggerHub Portal
      - name: ReadyAPI (Functional + Load Testing)
      - name: TestComplete (UI Test Automation)
      - name: Pact (Contract Testing)
      - name: BugSnag (Error Monitoring)
      - name: AlertSite (Synthetic Monitoring)
      - name: Reflect (No-Code Test Automation)
      - name: Zephyr (Test Management)
      - name: Stoplight (API Design Platform)
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
