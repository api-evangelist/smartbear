specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: SmartBear
providerId: smartbear
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - API Design
  - API Testing
  - Rate Limiting
description: SmartBear's products span design (SwaggerHub, Stoplight), testing (ReadyAPI, TestComplete,
  Pact), and observability (BugSnag, AlertSite). Each product publishes its own per-tenant rate limit
  policy inside its dedicated documentation portal; SmartBear does not publish a unified rate-limit
  document. This artifact is a placeholder pointing consumers to per-product docs.
sources:
  - https://smartbear.com/
notes: |
  Per-product rate limits live inside each tool's documentation (e.g. SwaggerHub API, BugSnag API,
  Pact Broker API). No unified SmartBear rate-limit page exists.
responseCodes:
  throttled: 429
limits:
  - name: Per-Product Throttling
    scope: tenant
    metric: varies
    limit: 'see per-product SmartBear documentation'
    notes: Each SmartBear product (SwaggerHub, BugSnag, AlertSite, Pact Broker, etc.) defines its
      own request-rate caps in its dedicated docs.
policies:
  - name: Per-Product Documentation
    description: SmartBear does not publish a unified rate-limit policy across products. Consumers
      must consult the product-specific documentation.
  - name: Backoff
    description: On 429 responses, clients should implement exponential backoff with jitter and
      honor any Retry-After header returned by the specific SmartBear service.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
